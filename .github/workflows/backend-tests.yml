name: Backend tests

on:
  push:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt
      - name: Install test dependencies
        run: python -m pip install -r backend/requirements-test.txt
      - name: Build Linux production backend
        run: docker build --target production --tag majoraudit-backend:ci backend
      - name: Run backend application tests
        run: >-
          docker run --rm --entrypoint python majoraudit-backend:ci
          manage.py test authentication worksheets courses majors
          --settings=backend.test_settings --noinput
      - name: Generate and validate OpenAPI specification
        run: >-
          docker run --rm --entrypoint python majoraudit-backend:ci
          manage.py spectacular --settings=backend.test_settings
          --format openapi-json --validate --fail-on-warn > openapi.json
      - name: Test CAS flow and live API contracts
        env:
          BACKEND_TEST_IMAGE: majoraudit-backend:ci
        run: python -m unittest discover -s backend/integration -p 'test_*.py' -v
      - name: Upload OpenAPI specification
        uses: actions/upload-artifact@v4
        with:
          name: backend-openapi
          path: openapi.json
          if-no-files-found: error
