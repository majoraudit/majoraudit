# Default development stack: source files are bind-mounted and both servers
# reload automatically. Use compose.prod.yaml for production-like verification.
services:
  backend:
    build:
      context: ./backend
      target: development
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      DATABASE_PATH: /data/db.sqlite3
      STATIC_ROOT: /static
    volumes:
      - ./backend:/app
      - backend-data:/data
      - django-static:/static
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "${APP_PORT:-5173}:5173"
    restart: unless-stopped

volumes:
  backend-data:
  django-static:
  frontend-node-modules:
